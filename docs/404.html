<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found, Muo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --bg-soft: #f6f6f4; --ink: #0a0a0a; --ink-2: #666666;
  --ink-3: #8f8f8c; --accent: #35577a;
  --font: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
a { color: var(--accent); text-underline-offset: 3px; }
.card { max-width: 480px; text-align: left; }
.mark { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--ink); text-decoration: none; margin-bottom: 48px; }
.mark img { width: 24px; height: 24px; border-radius: 6px; }
.code { font-family: var(--mono); font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; color: var(--ink-3); display: block; margin-bottom: 16px; }
h1 { font-size: 48px; line-height: 1; font-weight: 600; letter-spacing: -0.03em; text-wrap: balance; margin: 0 0 16px; }
p { font-size: 18px; line-height: 28px; color: var(--ink-2); text-wrap: pretty; margin: 0 0 32px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 16px; line-height: 24px; font-weight: 600; text-decoration: none; transition: background 700ms var(--ease), transform 700ms var(--ease); }
.btn:hover { background: #262626; }
.btn:active { transform: scale(0.98); }
</style>
</head>
<body>
  <div class="card">
    <a class="mark" href="index.html"><img src="icon.png" alt="" width="24" height="24">Muo</a>
    <span class="code">404</span>
    <h1>That page is not here</h1>
    <p>The link is broken or the page moved. The reader itself is one click away.</p>
    <a class="btn" href="index.html">Back to Muo</a>
  </div>
</body>
</html>
