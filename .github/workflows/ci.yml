name: CI

# Runs on every push and pull request, so a broken build or a failing test is
# known before a tag is ever pushed. The release workflow repeats these checks
# for the same reason: a tag that fails them builds nothing.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The app compiles for every platform from Linux, because MyGo needs no
      # cgo. This catches a build tag or a platform-specific file that only
      # breaks on one of them.
      - name: Compile every platform
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            echo "::group::$target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null .
            echo "::endgroup::"
          done

      # And once for the real thing, to prove the toolchain produces an app.
      - name: Build the app
        run: go build -o muo .
