name: Release

# Pushing a tag builds every platform and attaches the installers to a draft
# release. You publish the draft, which is the moment the release goes out.
#
# Muo is a native UI app with no frontend, so there is no Bun and no
# `bun install` here: go.mod pins the MyGo CLI as a tool, and `go tool mygo`
# runs that pinned version.

on:
  push:
    tags: ["v*"]
  # Build without publishing, to check that a change still compiles everywhere.
  workflow_dispatch:

permissions:
  contents: write # the draft release, and the uploads to it

concurrency:
  # A second tag pushed while the first is building replaces it rather than
  # racing it, which would leave two drafts with half the files each.
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The version in mygo.json is what the app reports and what the release
      # is named after. A tag that disagrees would publish under another
      # version, so it is checked before anything is built.
      - name: Check the tag matches mygo.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(jq -r .version mygo.json)"
          want="v${version}"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but mygo.json says $want"
            echo "Bump version in mygo.json, commit, then tag again."
            exit 1
          fi
          echo "Releasing $want"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  draft-release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # The draft exists before any build starts, so every platform uploads to
      # the same release. Without it each `mygo build -upload` would make a
      # draft of its own and the release page would be three half-releases.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: [check, draft-release]
    if: startsWith(github.ref, 'refs/tags/')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: the release is only
      # useful with all of them, and a re-run builds just the one that broke.
      fail-fast: false
      matrix:
        include:
          # Signing, notarizing and disk images need macOS, so that row runs
          # there. The app itself needs no cgo, so the other rows build on Linux.
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # NSIS makes the Windows installer, and the Linux runner has to install it
      # itself. A Windows runner would download it, but signing the installer
      # is easier on Linux where the tooling is one apt line away.
      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          # Signs the update manifests, so an installed app only accepts an
          # update this workflow produced. Generate the key with
          # `go tool mygo keygen` and add it as a repository secret.
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          go tool mygo build \
            -platform "${{ matrix.platform }}" \
            -upload

      # The installers stay on the run too, so a build can be downloaded and
      # tried without publishing a release first.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/*/*.dmg
            build/*/*.exe
            build/*/*.deb
            build/*/*.tar.gz
            build/*/update-*.json
